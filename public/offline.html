<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#247044" />
    <title>PlantCare AI — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: #f3f8f1;
        color: #1d3326;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      p {
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: #247044;
        color: #fff;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>PlantCare AI needs the internet to analyse a photo. Reconnect and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
